version: '3'
networks:
  ice:
    driver: bridge
    ipam:
        config:
        - subnet: 10.1.1.0/24

services :
  pihole:
    container_name: pihole
    hostname: pihole
    image: pihole/pihole:2025.02.6
    logging:
      driver: journald
    networks:
      ice:
        ipv4_address: 10.1.1.2
    ports:
      - '53:53/tcp'
      - '53:53/udp'
      - '8080:80/tcp'
    environment:
      TZ: 'Europe/Vienna'
      FTLCONF_webserver_api_password: '${PIHOLE_PASSWORD}'
      FTLCONF_dns_upstreams: '10.1.1.3'
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dhcp_active: true
      FTLCONF_dhcp_start: 192.168.86.21
      FTLCONF_dhcp_end: 192.168.86.250
      FTLCONF_dhcp_router: 192.168.86.1
    volumes:
      - '${HOST_ROOT}/pihole/:/etc/pihole/'
      - '${HOST_ROOT}/dnsmasq/:/etc/dnsmasq.d/'
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    depends_on:
      - unbound
      - dhcphelper

  dhcphelper:
    container_name: dhcphelper
    network_mode: host
    hostname: dhcphelper
    image: homeall/dhcphelper:latest
    logging:
      driver: journald
    environment:
      IP: '10.1.1.2'
      TZ: 'Europe/Vienna'
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    
  unbound:
    container_name: unbound
    hostname: unbound
    image: klutchell/unbound:1.22.0
    logging:
      driver: journald
    networks:
      ice:
        ipv4_address: 10.1.1.3
    ports:
      - 5053:53
    volumes:
      - ${HOST_ROOT}/unbound/custom.conf.d/:/etc/unbound/custom.conf.d/
      - ${HOST_ROOT}/unbound/unbound.conf/:/etc/unbound/unbound.conf
    restart: unless-stopped

  wg-easy:
    container_name: wg-easy
    hostname: wg-easy
    image: ghcr.io/wg-easy/wg-easy:14
    logging:
      driver: journald
    networks:
      ice:
        ipv4_address: 10.1.1.4
    environment:
      - PORT=51821
      - WG_PORT=51820
      - LANG=en
      - WG_HOST=${WG_PUBLIC_IP}
      - PASSWORD_HASH=${WG_PASSWORD_HASH}
      - WG_DEFAULT_DNS=10.1.1.2
    volumes:
      - '${HOST_ROOT}/wireguard/config:/etc/wireguard'
    ports:
      - '51820:51820/udp'
      - '51821:51821/tcp'
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
